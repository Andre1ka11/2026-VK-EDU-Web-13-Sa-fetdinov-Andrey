{% if page.has_other_pages %}
<nav class="mt-4" aria-label="Пагинация">
    <ul class="pagination justify-content-center gap-1">

        <li class="page-item {% if not page.has_previous %}disabled{% endif %}">
            <a class="page-link rounded-pill px-3"
               href="{% if page.has_previous %}?page={{ page.previous_page_number }}{% else %}#{% endif %}"
               aria-label="Назад">«</a>
        </li>

        {% for item in page.display_range %}
            {% if item is None %}
                <li class="page-item disabled"><span class="page-link px-2">…</span></li>
            {% elif item == page.number %}
                <li class="page-item active">
                    <span class="page-link rounded-pill px-3">{{ item }}</span>
                </li>
            {% else %}
                <li class="page-item">
                    <a class="page-link rounded-pill px-3" href="?page={{ item }}">{{ item }}</a>
                </li>
            {% endif %}
        {% endfor %}

        <li class="page-item {% if not page.has_next %}disabled{% endif %}">
            <a class="page-link rounded-pill px-3"
               href="{% if page.has_next %}?page={{ page.next_page_number }}{% else %}#{% endif %}"
               aria-label="Вперёд">»</a>
        </li>

    </ul>
</nav>
{% endif %}
